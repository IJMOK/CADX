<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CADX</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="ribbon"></header>
    <header id="sketch-bar" style="display: none"></header>
    <div id="main">
      <aside id="navigator">
        <h2>Part Navigator</h2>
        <ul id="tree"></ul>
      </aside>
      <div id="view-wrap">
        <canvas id="viewport" tabindex="0"></canvas>
      </div>
      <aside id="task-panel"></aside>
    </div>
    <footer id="statusbar">
      <span id="status-text">Starting…</span>
      <span id="status-pick"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
